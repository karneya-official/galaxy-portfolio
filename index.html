<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Your Name — Data Analyst</title>
    <meta
      name="description"
      content="Portfolio of a data analyst: turning data into clear, actionable insights. Placeholder content — replace with your own."
    />
    <meta name="theme-color" content="#050914" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />

    <!-- Fonts: Outfit (headings) + Inter (text). If offline, system fonts are used instead. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@200;300;400&display=swap"
      rel="stylesheet"
    />

    <!-- Social sharing (replace the url and image once you deploy) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Your Name — Data Analyst" />
    <meta
      property="og:description"
      content="Turning data into clear, actionable insights."
    />
    <!-- Once deployed, add a preview image (full URL) for link previews:
         <meta property="og:image" content="https://your-site.example/og-image.png" /> -->
    <meta name="twitter:card" content="summary" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
